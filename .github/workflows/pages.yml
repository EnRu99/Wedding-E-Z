# Publishes the invitation to GitHub Pages.
# Only the site itself is deployed (index.html + assets/), never source_material/.
# Until Pages is switched on (Settings → Pages → Source: "GitHub Actions"),
# pushes skip this job quietly; after that, every push to the branch updates the site.
name: Publish invitation

on:
  push:
    branches: [claude/dreamy-allen-46j3k9, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
